# Régua dos testes: catálogo de mutações dos controles críticos.
#
# Cada entrada desfaz UM controle (troca `de` por `para` no arquivo) e roda o teste que
# diz protegê-lo; o teste TEM de reprovar. `python scripts/regua.py mutacao` mede o
# placar e reprova se alguma mutação escapar, ou se o trecho `de` não existir mais (o
# código mudou e o catálogo não acompanhou: régua velha também é régua quebrada).
#
# Ao adicionar um controle crítico, entre aqui com ele. Ao refatorar um controle, o
# catálogo reprova até o trecho ser atualizado: é de propósito.
mutacoes:
  # ======================================================== pipeline e persistência
  - id: M-PIPE-01
    controle: falha de banco na evidência não apaga os findings (savepoint)
    arquivo: orchestrator/jobs/pipelines.py
    de: "async with s.begin_nested():\n                    await capturar_evidencias("
    para: "if True:\n                    await capturar_evidencias("
    teste: tests/integration/test_revisao_frentes_ace.py -k falha_de_banco_na_evidencia
  - id: M-PIPE-02
    controle: falha de banco no inventário não apaga os findings (savepoint)
    arquivo: orchestrator/jobs/pipelines.py
    de: "async with s.begin_nested():\n                await registrar_ativos("
    para: "if True:\n                await registrar_ativos("
    teste: tests/integration/test_revisao_frentes_ace.py -k falha_de_banco_no_inventario
  - id: M-PIPE-03
    controle: evidência redigida no findings.payload
    arquivo: orchestrator/jobs/pipelines.py
    de: payload=finding_redigido(f).model_dump(mode="json")
    para: payload=f.model_dump(mode="json")
    teste: tests/integration/test_limites_resolvidos.py -k payload_do_finding
  - id: M-REL-01
    controle: evidência redigida no relatório técnico HTML
    arquivo: orchestrator/reporting/renderer.py
    de: (finding_redigido(f) for f in result.findings)
    para: (f for f in result.findings)
    teste: tests/integration/test_limites_resolvidos.py -k relatorio_html
  - id: M-SCAN-01
    controle: scan em andamento não pode ser apagado (409)
    arquivo: orchestrator/api/routers/scans.py
    de: "    if scan.state in (ScanState.PENDING.value, ScanState.RUNNING.value):\n        raise HTTPException(409"
    para: "    if False:\n        raise HTTPException(409"
    teste: tests/integration/test_revisao_frentes_ace.py -k em_andamento_nao_pode
  - id: M-SCAN-02
