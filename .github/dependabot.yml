version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    groups:
      runtime:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "*pytest-*"]
      dev:
        patterns: ["pytest*", "ruff", "mypy", "*pytest-*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/docker/images/orchestrator"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "docker"]
    # A base python acompanha o requires-python, o mypy e o CI. Subir de 3.13 é
    # mudança do repo inteiro, não da imagem sozinha (PR #5 fechado por isso).
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
