name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        # Pin: ruff sem pin fazia o ÚNICO gate bloqueante do CI quebrar sozinho
        # a cada release que muda formatação (main já estava vermelha por isso).
        run: python -m pip install --upgrade pip 'ruff==0.16.5'
      - name: ruff check
        run: ruff check orchestrator tests
      - name: ruff format --check
        run: ruff format --check orchestrator tests

  lockfile:
    name: Lockfile em dia (uv)
    runs-on: ubuntu-latest
    # SEC-08: o repo não tinha lock e zero pins `==`, e o Dockerfile instalava uma
    # lista manual divergente do pyproject. Um lock que ninguém verifica é
    # decoração: este gate reprova se o pyproject mudar sem o uv.lock ser
    # regenerado (mutação confirmada: rc 1 ao adicionar dep sem relockar).
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv lock --check
        run: uv lock --check

  docs:
    name: Documentação em dia
    runs-on: ubuntu-latest
    # Regra sem mecanismo é decoração. "Manter a doc atualizada" é um bom propósito
    # e um péssimo controle: ninguém percebe quando ela envelhece. Este gate compara
    # a documentação com o CÓDIGO e reprova quando divergem. Mutação confirmada:
    # scanner novo sem documentar, Settings sem .env.example, e doc chamando de
    # "stub" o que já roda — os três dão exit 1.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: check docs fresh
        run: python scripts/check_docs_fresh.py

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    # v0.1 baseline: codebase ainda nao passa em strict typecheck.
    # Mantemos o job rodando (visibilidade) mas nao bloqueia merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy orchestrator

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Gate bloqueante: a suíte reprova o merge (o teste do scrubber que "falhava"
    # era o SEC-02, agora consertado). O piso de cobertura é catraca que só sobe —
    # hoje ~35%, dominado por módulos puros; o e2e de HTTP dos controles é backlog.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov=orchestrator --cov-report=term-missing --cov-fail-under=34

  build-image:
    name: Build orchestrator image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/images/orchestrator/Dockerfile
          push: false
          tags: cai-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
