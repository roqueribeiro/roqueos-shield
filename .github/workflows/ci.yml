name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install ruff
        # Pin: ruff sem pin fazia o ÚNICO gate bloqueante do CI quebrar sozinho
        # a cada release que muda formatação (main já estava vermelha por isso).
        run: python -m pip install --upgrade pip 'ruff==0.17.4'
      - name: ruff check
        # scripts/ entrou aqui junto com o gerador de diagramas: codigo que o CI nao
        # olha vira a excecao que come o padrao inteiro.
        run: ruff check orchestrator tests scripts
      - name: ruff format --check
        run: ruff format --check orchestrator tests scripts

  lockfile:
    name: Lockfile em dia (uv)
    runs-on: ubuntu-latest
    # SEC-08: o repo não tinha lock e zero pins `==`, e o Dockerfile instalava uma
    # lista manual divergente do pyproject. Um lock que ninguém verifica é
    # decoração: este gate reprova se o pyproject mudar sem o uv.lock ser
    # regenerado (mutação confirmada: rc 1 ao adicionar dep sem relockar).
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: uv lock --check
        run: uv lock --check

  docs:
    name: Documentação em dia
    runs-on: ubuntu-latest
    # Regra sem mecanismo é decoração. "Manter a doc atualizada" é um bom propósito
    # e um péssimo controle: ninguém percebe quando ela envelhece. Este gate compara
    # a documentação com o CÓDIGO e reprova quando divergem. Mutação confirmada:
    # scanner novo sem documentar, Settings sem .env.example, e doc chamando de
    # "stub" o que já roda — os três dão exit 1.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: check docs fresh
        run: python scripts/check_docs_fresh.py

  diagramas:
    name: Diagramas em dia
    runs-on: ubuntu-latest
    # Diagrama versionado que ninguem consegue refazer vira uma foto antiga da
    # arquitetura pendurada no README. As 36 figuras (9 diagramas x PT/EN x
    # claro/escuro, em docs/assets/diagramas/) sao GERADAS por scripts/diagrams/;
    # este gate confere que o SVG em disco e o que o codigo produz agora. Mutacao
    # confirmada: texto mudado num modulo sem regerar e arquivo orfao na pasta
    # dao exit 1; arvore regerada da exit 0.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: check diagrams fresh
        run: python scripts/gen_diagrams.py --check

  silencio:
    name: Contrato do silencio (adapters)
    runs-on: ubuntu-latest
    # O defeito mais caro deste repo apareceu NOVE vezes com a mesma forma: o
    # scanner nao roda, o erro e engolido, e zero achados vira "alvo limpo". Um
    # scanner quebrado produz a MESMA saida de um alvo seguro.
    # "Sempre trate o erro" e um bom proposito e um pessimo controle: ninguem
    # percebe a volta do padrao numa revisao de diff. Este gate compara o CODIGO com
    # a regra (AST, nao grep) e reprova o merge.
    # Mutacao confirmada, quatro plantios: `except` devolvendo vazio, `except`
    # devolvendo vazio EMBRULHADO num RawResults, poll decidindo so por task.done(),
    # e dict de sucesso fabricado -- os quatro dao exit 1. Arvore limpa, exit 0. O
    # escape `# silencio-ok: motivo` e aceito, e o motivo escrito e o que denuncia
    # um abuso na revisao.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: check no silence
        run: python scripts/check_no_silence.py

  secrets:
    name: Segredo no repo (gitleaks)
    runs-on: ubuntu-latest
    # Repo PUBLICO: segredo commitado aqui vaza para sempre (fica no historico e em
    # todos os clones). Este gate roda a cada push e reprova o merge.
    # As regras proprias existem porque o conjunto padrao do gitleaks NAO pega uma
    # chave da Anthropic — medido: um literal completo passou com "no leaks found",
    # e a chave de LLM e o segredo mais provavel deste projeto. Mutacao confirmada:
    # chave Anthropic e token do GitHub plantados dao exit 1; repo limpo, exit 0.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # o historico inteiro: segredo antigo tambem vaza
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  self-scan:
    name: A ferramenta se escaneia (SAST)
    runs-on: ubuntu-latest
    # Dogfooding: uma ferramenta de seguranca que nao passa no proprio scanner nao
    # tem credibilidade para escanear o codigo dos outros. Roda o mesmo Semgrep que
    # o adapter usa, sobre este repo.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: install semgrep
        run: python -m pip install --upgrade pip "semgrep>=1.100.0"
      - name: semgrep (o repo sobre si mesmo)
        run: |
          semgrep scan --config p/security-audit --config p/secrets \
            --error --metrics off --disable-version-check \
            orchestrator/ scripts/

  efetividade:
    name: A ferramenta acha de verdade (e2e)
    runs-on: ubuntu-latest
    # O resto da suite prova que a ferramenta NAO MENTE quando falha. Este gate
    # responde a outra pergunta: ela ACHA alguma coisa? Sem ele, uma ferramenta que
    # so levantasse excecao passaria em tudo -- e "0 achados" e o estado natural de
    # um scanner quebrado.
    # Monta um repo com defeito conhecido (injecao de comando, SQLi por taint,
    # pickle, MD5, debug ligado, bucket S3 publico, SG 0.0.0.0/0, disco sem cifra),
    # roda o pipeline inteiro e exige achado real de cada camada. Mutacao
    # confirmada: com o default antigo (`--config auto`, incompativel com
    # `--metrics off`) o SAST nao roda e o gate reprova em ~5s.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + scanners
        # checkov num venv próprio, como na imagem: no mesmo ambiente do app o
        # resolvedor do pip entrava em backtracking sem fim (30 min parado em
        # 23/10/2026, depois das dependências da #13). semgrep já vem no extra dev.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m venv /tmp/checkov-venv
          /tmp/checkov-venv/bin/pip install --quiet "checkov==3.3.15"
          mkdir -p /tmp/scanners-bin && ln -sf /tmp/checkov-venv/bin/checkov /tmp/scanners-bin/checkov
          echo "/tmp/scanners-bin" >> "$GITHUB_PATH"
      - name: e2e de efetividade
        run: pytest tests/integration/test_efetividade_e2e.py -v

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    # Gate bloqueante: `mypy orchestrator` em strict (pyproject.toml, issue #7). O mypy
    # é pinado no extra dev para uma release nova não reprovar o merge sozinha.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy orchestrator

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # Gate bloqueante: a suíte reprova o merge (o teste do scrubber que "falhava"
    # era o SEC-02, agora consertado). O piso de cobertura é catraca que só sobe —
    # hoje 65%; a varredura do silêncio (adapters + integridade) subiu o piso de 34.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov=orchestrator --cov-report=term-missing --cov-fail-under=64

  build-image:
    name: Build orchestrator image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/orchestrator/Dockerfile
          push: false
          tags: cai-orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tela standalone (web/) contra um shield de verdade: builda com o lockfile, sobe o
  # uvicorn com SQLite novo e roda o e2e em 1440 e 390 (primeiro uso, seções sem
  # transbordo, fluxo de Usuários). Teste de mutação: sem o ROSConfirmHost montado o
  # e2e reprova no "desativar" (medido em 2026-11-06).
  web:
    name: Tela standalone (build + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.20.0"
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Nenhuma versão do lock com menos de 14 dias
        working-directory: web
        run: node scripts/idade-do-lock.mjs
      - name: yarn install (lockfile congelado)
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: quasar build
        working-directory: web
        run: yarn build
      - name: Chromium do Playwright
        working-directory: web
        run: yarn playwright install --with-deps chromium
      - name: e2e da tela
        env:
          PYTHON: python
        run: scripts/web_e2e.sh
      - name: Prints do e2e
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-shots
          path: web/e2e/shots
          if-no-files-found: ignore

  # A imagem do container único (engine + ZAP + Redis + tela) builda e fica saudável.
  # Só em PR: são ~4 GB. Sobe o container, espera o HEALTHCHECK, e confere o primeiro
  # uso pela API, o CLI dentro da imagem e os templates do nuclei legíveis como UID 1000.
  standalone-image:
    name: Imagem standalone (build + saúde)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Libera disco do runner
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build do engine
        run: docker build -f docker/images/orchestrator/Dockerfile -t roqueos-shield-engine:ci .
      - name: Build do standalone
        run: >
          docker build -f docker/images/standalone/Dockerfile
          --build-arg ENGINE=roqueos-shield-engine:ci -t roqueos-shield-standalone:ci .
      - name: Sobe e espera ficar saudável
        run: |
          docker run -d --name rs -p 127.0.0.1:8080:8080 -v rs-data:/data roqueos-shield-standalone:ci
          for i in $(seq 1 60); do
            s="$(docker inspect -f '{{.State.Health.Status}}' rs)"
            [ "$s" = healthy ] && break
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' rs | grep -qx healthy || { docker logs rs | tail -80; exit 1; }
          curl -fsS http://127.0.0.1:8080/setup | grep -q '"needs_setup":true'
          docker exec rs roqueshield --help >/dev/null
          docker exec rs nuclei -duc -tl | wc -l | awk '{ if ($1 < 1000) { print "nuclei com " $1 " templates"; exit 1 } }'
      - name: Logs do container
        if: failure()
        run: docker logs rs | tail -200

  # Publica a imagem do orchestrator no ghcr quando a main anda (em PR o job acima so
  # valida que builda). A esteira entrega a imagem pronta pra quem nao quer buildar na
  # mao: `docker pull ghcr.io/<owner>/cai-orchestrator:latest`. Usa o GITHUB_TOKEN
  # embutido (nenhum segredo novo), e so publica DEPOIS de todos os gates (needs), nunca
  # uma imagem que nao passou no contrato-do-silencio, no mypy e nos testes.
  publish-image:
    name: Publish orchestrator image (ghcr)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
      - web
      - typecheck
      - test
      - silencio
      - efetividade
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Owner em minusculas
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Login no ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/images/orchestrator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/cai-orchestrator:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/cai-orchestrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
