# Scanners externos: ZAP, Trivy, kali-toolbox.
# Subir junto com compose.yml via --profile scanners.

name: cai

services:
  zap:
    image: zaproxy/zap-stable:latest
    container_name: cai-zap
    # Teto de memória do container + restart. O AJAX spider (browser headless) pode
    # estourar a RAM sob um alvo pesado; sem teto, o estouro derrubava a VM INTEIRA do
    # Docker e levava junto postgres/redis/alvo (OOM da VM, não do container). Com o teto,
    # um estouro é contido no cgroup do ZAP e só o ZAP reinicia, o resto da stack fica de
    # pé. 6g cabe numa VM de 8g deixando folga pros outros containers (postgres/redis/
    # alvo/orchestrator somam ~1,3g). O ajax é limitado no zap_adapter (1 browser,
    # profundidade e estados) e fica ~4g; o active scan guarda a sessão inteira (as URLs
    # que o ajax achou) em memória e precisa de mais, por isso 6g e não 5g. Box menor:
    # suba a RAM da VM do Docker ou afrouxe por aqui. O teto é a rede de proteção.
    mem_limit: 6g
    restart: unless-stopped
    # O AJAX spider sobe um browser headless (Firefox). O renderer do browser usa
    # /dev/shm, que no Docker tem só 64 MB por padrão (pouco pra uma SPA grande), e o
    # renderer quebra no meio do crawl. 1 GB é o padrão recomendado pra browser em
    # container. (O número de browsers em paralelo é limitado no zap_adapter, pra não
    # estourar a RAM da VM; ver _start_ajax.)
    shm_size: "1gb"
    # A imagem traz ZAP_PORT=8080 e o HEALTHCHECK faz curl nessa porta. O daemon sobe na
    # 8090, então sem isto o container fica "unhealthy" para sempre.
    environment:
      - ZAP_PORT=8090
      - ZAP_API_KEY=${ZAP_API_KEY:-changeme}
    # A chave da API NÃO vai na linha de comando: `-config api.key=...` aparecia em `ps`,
    # em /proc/<pid>/cmdline e no `docker inspect` (Config.Cmd). O entrypoint lê a
    # chave do ambiente, grava um arquivo 0600 e acrescenta só o caminho (-configfile)
    # ao command, como o supervisor do standalone já fazia. O `unset` tira a chave do
    # ambiente do java antes do exec. Os $$ são do compose: quem expande é o sh do container.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        : "$${ZAP_API_KEY:?ZAP_API_KEY vazio}"
        umask 077
        arq="$${HOME:-/home/zap}/zap-api.properties"
        printf 'api.disablekey=false\napi.key=%s\n' "$$ZAP_API_KEY" > "$$arq"
        unset ZAP_API_KEY
        exec "$$@" -configfile "$$arq"
      - zap-entrypoint
    # Só o que não é segredo vai no command; o entrypoint acrescenta o -configfile.
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8090"
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    healthcheck:
      # A mesma checagem do HEALTHCHECK da imagem, explícita e com start_period: o ZAP
      # leva um a dois minutos para abrir a porta. Sem a chave na URL de propósito.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - cai-net
    profiles:
      - scanners

  trivy:
    image: aquasec/trivy:latest
    container_name: cai-trivy
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - "127.0.0.1:4954:4954"
    volumes:
      - trivy_cache:/root/.cache/trivy
    networks:
      - cai-net
    profiles:
      - scanners

  kali-toolbox:
    build:
      context: ..
      dockerfile: docker/images/kali-toolbox/Dockerfile
    image: cai-kali-toolbox:dev
    container_name: cai-kali-toolbox
    # SEC-06: idem orchestrator — e aqui importa mais, porque é o container que a
    # Onda 2 vai usar como executor do agente ofensivo.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cai-net
    volumes:
      - kali_workspace:/workspace
    # mantém container rodando pra docker exec
    command: ["sleep", "infinity"]
    profiles:
      - scanners

volumes:
  trivy_cache:
  kali_workspace:
