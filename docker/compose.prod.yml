# RoqueShield em produção: a MESMA imagem do standalone, com cada peça no seu serviço.
#
#   docker compose -f docker/compose.prod.yml --env-file .env up -d
#   docker compose -f docker/compose.prod.yml --env-file .env up -d --scale worker=3
#
# O --env-file é obrigatório: com -f, o compose procura o .env em docker/, não na raiz.
#
# Diferenças para o `docker run` tudo-em-um:
# - Postgres em vez de SQLite: a trilha de auditoria fica imutável (trigger da
#   migration 0004) e REQUIRE_IMMUTABLE_AUDIT=true passa a valer. Quem migra é o
#   serviço `shield` (o supervisor roda `alembic upgrade head` antes da API).
# - Redis e ZAP em serviços próprios; o supervisor vê REDIS_URL e ZAP_BASE_URL
#   apontando para fora e não sobe os embutidos.
# - Workers separados e escaláveis (SHIELD_SERVICES=worker).
#
# Obrigatórios no .env: SHIELD_VERSION (a tag da imagem, ex. v0.5.0), POSTGRES_PASSWORD,
# REDIS_PASSWORD, APP_TOKEN, SESSION_SECRET, SECRETS_KEY, ZAP_API_KEY. As chaves do ZAP e
# do Redis chegam aos dois serviços por ambiente e viram arquivo 0600 no entrypoint:
# nenhuma aparece na linha de comando. Em produção, gere-os
# no cofre e injete aqui. O código de primeiro uso (SETUP_CODE) é gerado no volume
# shield_data se não vier no .env:  docker compose ... exec shield cat /data/secrets/SETUP_CODE
# Opcionais: SHIELD_BIND (padrão 127.0.0.1) e SHIELD_PORT (padrão 8080) para a porta
# publicada no host.

name: roqueshield

x-shield: &shield
  image: "roqueribeiro1988/roqueos-shield:${SHIELD_VERSION:?defina SHIELD_VERSION (ex. v0.5.0)}-standalone"
  # O supervisor dá até 8 s para os processos saírem; a margem evita SIGKILL no meio.
  stop_grace_period: 30s
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Raiz só de leitura (Issue #12). O supervisor e os scanners escrevem em /data
  # (volume; HOME=/data na imagem) e em /tmp (tmpfs: mkdtemp dos adapters e clone do
  # repo escaneado). O nmap faz connect scan (-sT -Pn) e não precisa de NET_RAW, por
  # isso não existe uma rede ou um worker à parte para ele (decisão da #12).
  read_only: true
  tmpfs:
    - /tmp:size=2g
  environment: &env
    DATABASE_URL: postgresql+asyncpg://roqueshield:${POSTGRES_PASSWORD:?}@postgres:5432/roqueshield
    REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    ZAP_BASE_URL: http://zap:8090
    ZAP_API_KEY: ${ZAP_API_KEY:?}
    APP_TOKEN: ${APP_TOKEN:?}
    SESSION_SECRET: ${SESSION_SECRET:?}
    SECRETS_KEY: ${SECRETS_KEY:?}
    REQUIRE_IMMUTABLE_AUDIT: "true"
    ALLOW_CLOUD_FALLBACK: ${ALLOW_CLOUD_FALLBACK:-false}
    REQUIRE_AUTH_REF: ${REQUIRE_AUTH_REF:-true}
  volumes:
    - shield_data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    zap:
      condition: service_started

services:
  shield:
    <<: *shield
    environment:
      <<: *env
      SHIELD_SERVICES: orchestrator
    ports:
      - "${SHIELD_BIND:-127.0.0.1}:${SHIELD_PORT:-8080}:8080"
    healthcheck:
      # O mesmo do HEALTHCHECK da imagem, escrito aqui para quem lê o compose.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    <<: *shield
    environment:
      <<: *env
      SHIELD_SERVICES: worker
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roqueshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: roqueshield
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roqueshield"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Senha obrigatória: o ZAP, na mesma rede, processa conteúdo hostil, e o arq
    # desserializa job com pickle. Redis aberto na rede era RCE no worker.
    # A senha vai por arquivo 0600 e não por `--requirepass`: argumento aparece em `ps` e
    # em /proc/<pid>/cmdline. É o que o supervisor faz com o Redis embutido.
    command:
      - sh
      - -c
      - |
        set -eu
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD vazio}"
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        unset REDIS_PASSWORD
        exec redis-server /tmp/redis-auth.conf --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  zap:
    image: zaproxy/zap-stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    restart: unless-stopped
    mem_limit: 6g
    shm_size: "1gb"
    environment:
      ZAP_PORT: "8090"
      ZAP_API_KEY: ${ZAP_API_KEY:?}
    # A chave da API NÃO vai na linha de comando: `-config api.key=...` aparecia em `ps`,
    # em /proc/<pid>/cmdline e no `docker inspect` (Config.Cmd). O entrypoint lê a
    # chave do ambiente, grava um arquivo 0600 e passa só o caminho (-configfile),
    # como o supervisor do standalone já fazia. O `unset` tira a chave do ambiente do
    # java antes do exec. Os $$ são do compose: quem expande é o sh do container.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        : "$${ZAP_API_KEY:?ZAP_API_KEY vazio}"
        umask 077
        arq="$${HOME:-/home/zap}/zap-api.properties"
        printf 'api.disablekey=false\napi.key=%s\n' "$$ZAP_API_KEY" > "$$arq"
        unset ZAP_API_KEY
        exec zap.sh -daemon -host 0.0.0.0 -port 8090 \
          -config 'api.addrs.addr.name=.*' -config api.addrs.addr.regex=true \
          -configfile "$$arq"
    healthcheck:
      # A mesma checagem do HEALTHCHECK da imagem, explícita e com start_period: o ZAP
      # leva um a dois minutos para abrir a porta. Sem a chave na URL de propósito.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  shield_data:
  pg_data:
