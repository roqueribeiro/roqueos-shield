# CAI — base compose. Sobe orchestrator + Postgres + Redis + Ollama.
#
# Profiles:
#   default      orchestrator + db + redis + ollama
#   scanners     ZAP + Trivy + kali-toolbox
#   greenbone    stack Greenbone Community (~5GB feed sync inicial)
#   lab          alvos vulneráveis (Juice Shop, DVWA, WebGoat)
#   obs          Phoenix tracing
#   ai-agent     cai-expert (Fase 4)
#
# Uso (Makefile esconde os flags):
#   docker compose -f docker/compose.yml \
#                  -f docker/compose.scanners.yml \
#                  -f docker/compose.lab.yml \
#                  --profile scanners --profile lab up -d

name: cai

services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/images/orchestrator/Dockerfile
    image: cai-orchestrator:dev
    container_name: cai-orchestrator
    # SEC-06 / Issue #12: sem capability nenhuma e não-root (a imagem roda como UID
    # 1000). A API não executa scanner. no-new-privileges impede escalada por setuid.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    volumes:
      - ../reports:/app/reports
      - ../data:/app/data
      - ../config:/app/config:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - cai-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    entrypoint: ["uvicorn"]
    command: ["orchestrator.main:app", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - default
      - scanners

  worker:
    build:
      context: ..
      dockerfile: docker/images/orchestrator/Dockerfile
    image: cai-orchestrator:dev
    container_name: cai-worker
    # SEC-06 / Issue #12: não-root (UID 1000) e sem capability. Sem root, NET_RAW
    # não chegaria ao processo de qualquer jeito: o nmap faz connect scan (-sT).
    # Separar um worker só de nmap com raw socket continua em aberto na #12.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    volumes:
      - ../reports:/app/reports
      - ../data:/app/data
      - ../config:/app/config:ro
    networks:
      - cai-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    entrypoint: ["arq"]
    command: ["orchestrator.jobs.queue.WorkerSettings"]
    profiles:
      - default
      - scanners

  postgres:
    image: postgres:16-alpine
    container_name: cai-postgres
    environment:
      POSTGRES_USER: cai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cai-dev-changeme}
      POSTGRES_DB: cai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cai -d cai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cai-net
    profiles:
      - default
      - scanners

  redis:
    image: redis:7-alpine
    container_name: cai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cai-net
    profiles:
      - default
      - scanners

  ollama:
    image: ollama/ollama:latest
    container_name: cai-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - cai-net
    profiles:
      - default
      - ai-local

networks:
  cai-net:
    driver: bridge

volumes:
  ollama_models:
  pgdata:
