[project]
name = "cai-orchestrator"
version = "0.1.0"
description = "Continuous AI Security — vulnerability scanning + AI triage + AI Fix Bundle for AI patchers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Roque Ribeiro", email = "roqueribeiro@users.noreply.github.com" }]
maintainers = [{ name = "Roque Ribeiro", email = "roqueribeiro@users.noreply.github.com" }]
keywords = [
    "security",
    "pentest",
    "vulnerability-scanner",
    "appsec",
    "owasp",
    "ai",
    "litellm",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # web framework + server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # persistence (SQLite e Postgres ambos suportados via DATABASE_URL)
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",

    # http async
    "httpx>=0.27.0",

    # logging estruturado
    "structlog>=24.4.0",

    # AI gateway. Bump >=1.70 cobre CVE de prompt injection / rate-limit
    # (issue #7 do backlog).
    "litellm>=1.70.0",

    # scanners — clientes
    "python-libnmap>=0.7.3",
    "zaproxy>=0.3.2",
    # XML hardening (XXE / billion-laughs) para parsers de Greenbone/etc.
    "defusedxml>=0.7.1",

    # fila assíncrona
    "arq>=0.26.1",
    "redis>=5.2.0",

    # OSINT (Fase 2.5)
    "PyGithub>=2.5.0",
    "shodan>=1.31.0",

    # Greenbone (Fase 3)
    "python-gvm>=24.8.0",

    # auth (Fase 6). authlib >=1.7 cobre CVE-2024-37568 (OIDC implicit grant).
    "authlib>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # SessionMiddleware (starlette) assina o cookie de state/nonce do fluxo OIDC.
    "itsdangerous>=2.1.0",

    # relatório
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",

    # CLI
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
# instalação opcional — algumas têm peso nativo grande no Windows
pdf = ["weasyprint>=63.0"]            # PDF rendering (Fase 5)
agentic = ["cai-framework>=0.1.0"]    # CAI agentic (Fase 4)
tracing = ["arize-phoenix>=6.0.0", "openinference-instrumentation-litellm>=0.1.0"]
censys = ["censys>=2.2.0"]
sast = ["semgrep>=1.100.0"]           # SAST de código-fonte (adapter semgrep)
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "semgrep>=1.100.0",               # roda o e2e do semgrep_adapter no CI
]

[project.urls]
Homepage      = "https://github.com/roqueribeiro/more4cai"
Repository    = "https://github.com/roqueribeiro/more4cai"
Documentation = "https://github.com/roqueribeiro/more4cai#readme"
Issues        = "https://github.com/roqueribeiro/more4cai/issues"
Discussions   = "https://github.com/roqueribeiro/more4cai/discussions"
Changelog     = "https://github.com/roqueribeiro/more4cai/blob/main/CHANGELOG.md"
Security      = "https://github.com/roqueribeiro/more4cai/blob/main/SECURITY.md"

[project.scripts]
cai = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",     # assert OK em testes
    "S603",     # subprocess com argv list é seguro
    "S607",     # subprocess com path parcial OK (usamos PATH controlado)
    # TODO(v0.2): backlog de cleanup — re-habilitar gradualmente
    "E501",     # line-too-long: muitos hits em strings/f-strings longas
    "F841",     # unused-variable em handlers de erro a limpar
    "B006",     # mutable-argument-default em CLI args legados
    "B017",     # assert raises Exception (testes de smoke)
    "ASYNC109", # async function com argumento `timeout=`
    "ASYNC240", # blocking-path-method em async (Path.exists)
    "S104",     # hardcoded-bind-all-interfaces em compose/Settings (intencional)
    "S105",     # hardcoded-password-string em fixtures de teste
    "S112",     # try/except/continue documentado no audit log
    "S314",     # xml.etree em adapters de scanners confiáveis
]

[tool.mypy]
python_version = "3.13"
# TODO(v0.2): re-habilitar strict mode após cleanup do backlog de tipos.
# O codebase v0.1 tem ~50 erros mypy (import-not-found em deps opcionais,
# call-overload em SQLModel, no-any-return em parsers de scanner).
strict = false
warn_return_any = false
ignore_missing_imports = true
# Mantemos opções uteis sem o strict pesado
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
