[project]
name = "cai-orchestrator"
version = "0.1.0"
description = "Continuous AI Security — vulnerability scanning + AI triage + AI Fix Bundle for AI patchers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Roque Ribeiro", email = "roqueribeiro@users.noreply.github.com" }]
maintainers = [{ name = "Roque Ribeiro", email = "roqueribeiro@users.noreply.github.com" }]
keywords = [
    "security",
    "pentest",
    "vulnerability-scanner",
    "appsec",
    "owasp",
    "ai",
    "litellm",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # web framework + server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # persistence (SQLite e Postgres ambos suportados via DATABASE_URL)
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",

    # http async
    "httpx>=0.27.0",

    # logging estruturado
    "structlog>=24.4.0",

    # AI gateway. Bump >=1.70 cobre CVE de prompt injection / rate-limit
    # (issue #7 do backlog).
    "litellm>=1.84.0",

    # scanners — clientes
    "zaproxy>=0.3.2",
    # XML hardening (XXE / billion-laughs) para os parsers de nmap e Greenbone. O
    # python-libnmap saiu (CVE-2022-30284, XXE): o nmap tem parser próprio.
    "defusedxml>=0.7.1",

    # fila assíncrona
    "arq>=0.26.1",
    "redis>=5.2.0",

    # OSINT (Fase 2.5)
    "PyGithub>=2.5.0",
    "shodan>=1.31.0",

    # Greenbone (Fase 3)
    "python-gvm>=24.8.0",

    # auth (Fase 6). authlib >=1.7 cobre CVE-2024-37568 (OIDC implicit grant).
    "authlib>=1.7.0",
    # python-jose saiu (CVE-2024-33663/33664, projeto parado): PyJWT >=2.14 corrige os
    # CVE-2026-1022xx da 2.13.
    "pyjwt[crypto]>=2.14.0",
    "passlib[bcrypt]>=1.7.4",
    # SessionMiddleware (starlette) assina o cookie de state/nonce do fluxo OIDC.
    "itsdangerous>=2.1.0",

    # relatório
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",

    # CLI
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
# instalação opcional — algumas têm peso nativo grande no Windows
pdf = ["weasyprint>=70.0"]            # PDF rendering (Fase 5); >=70 corrige CVE-2026-106443
# `agentic` (cai-framework) saiu em 23/10/2026: o loop agêntico é nosso (litellm +
# executor com coleira) e nada importa o pacote; a última versão (0.5.10) é a do
# GHSA-4996-996j-2m9r e fixa openai==1.75, o que prendia o lock em litellm vulnerável.
tracing = ["arize-phoenix>=20.26.0", "openinference-instrumentation-litellm>=0.1.0"]
censys = ["censys>=2.2.0"]
sast = ["semgrep>=1.100.0"]           # SAST de código-fonte (adapter semgrep)
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff==0.16.5",   # pinado: formatação do ruff muda entre releases e quebra o gate
    "mypy>=1.13.0",
    "semgrep>=1.100.0",               # roda o e2e do semgrep_adapter no CI
]

[project.urls]
Homepage      = "https://github.com/roqueribeiro/roqueos-shield"
Repository    = "https://github.com/roqueribeiro/roqueos-shield"
Documentation = "https://github.com/roqueribeiro/roqueos-shield#readme"
Issues        = "https://github.com/roqueribeiro/roqueos-shield/issues"
Discussions   = "https://github.com/roqueribeiro/roqueos-shield/discussions"
Changelog     = "https://github.com/roqueribeiro/roqueos-shield/blob/main/CHANGELOG.md"
Security      = "https://github.com/roqueribeiro/roqueos-shield/blob/main/SECURITY.md"

[project.scripts]
cai = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# O semgrep (dev e sast) fixa opentelemetry-api <1.38 e o arize-phoenix >=20.26 (tracing)
# exige >=1.44: os dois extras não cabem no mesmo ambiente. Cada um resolve no seu
# ramo do lock; o tracing fica com o phoenix que traz strawberry-graphql 0.335
# (CVE-2026-107728 corrigido).
# O ramo `tracing` fica com o litellm 1.107.0rc2, de propósito: o arize-phoenix que
# corrige o strawberry-graphql (CVE-2026-107728) exige openai>=3, e só o litellm 1.107
# (ainda rc em 23/10/2026) aceita openai 3. Extra opt-in, fora da imagem; o ambiente
# base e o de dev usam o litellm estável. Revisar quando sair o 1.107 final.
conflicts = [
    [{ extra = "dev" }, { extra = "tracing" }],
    [{ extra = "sast" }, { extra = "tracing" }],
]

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = [
    "S101",     # assert OK em testes
    "S603",     # subprocess com argv list é seguro
    "S607",     # subprocess com path parcial OK (usamos PATH controlado)
    # TODO(v0.2): backlog de cleanup — re-habilitar gradualmente
    "E501",     # line-too-long: muitos hits em strings/f-strings longas
    "F841",     # unused-variable em handlers de erro a limpar
    "B006",     # mutable-argument-default em CLI args legados
    "B017",     # assert raises Exception (testes de smoke)
    "ASYNC109", # async function com argumento `timeout=`
    "ASYNC240", # blocking-path-method em async (Path.exists)
    "S104",     # hardcoded-bind-all-interfaces em compose/Settings (intencional)
    "S105",     # hardcoded-password-string em fixtures de teste
    "S112",     # try/except/continue documentado no audit log
    "S314",     # xml.etree em adapters de scanners confiáveis
]

[tool.ruff.lint.per-file-ignores]
# c4lib e uma DSL de desenho, e o import estrela da aos nove diagramas as ~30
# primitivas (node, edge, boundary, row, step, table, chip...) sem repetir uma lista
# de import de 30 nomes em cada arquivo. O ganho de listar nao paga o ruido, e o
# modulo nao exporta nada com efeito colateral.
"scripts/diagrams/d0*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.13"
# TODO(v0.2): re-habilitar strict mode após cleanup do backlog de tipos.
# O codebase v0.1 tem ~50 erros mypy (import-not-found em deps opcionais,
# call-overload em SQLModel, no-any-return em parsers de scanner).
strict = false
warn_return_any = false
ignore_missing_imports = true
# Mantemos opções uteis sem o strict pesado
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
