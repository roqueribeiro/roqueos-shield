# Varredura de segredo do próprio repositório.
#
# Este repo é PÚBLICO: um segredo commitado aqui vaza para sempre, porque fica no
# histórico e em todos os clones. O gate `secrets` do CI roda o gitleaks a cada push
# e reprova o merge — a proteção não pode depender de alguém lembrar de olhar.
#
# POR QUE HÁ REGRAS PRÓPRIAS AQUI: o conjunto padrão do gitleaks NÃO pega uma chave
# da Anthropic. Foi medido — um literal `sk-ant-api03-...` completo plantado no
# `config.py` passou com "no leaks found". E a chave de LLM é justamente o segredo
# mais provável deste projeto, porque toda instalação configura uma. As regras abaixo
# cobrem os provedores que este código realmente usa.

title = "more4cai — secret scanning"

[extend]
useDefault = true

# ---------------------------------------------------------------- regras próprias

[[rules]]
id = "anthropic-api-key"
description = "Chave da Anthropic (o segredo mais provável deste projeto)"
regex = '''sk-ant-(?:api\d{2}|sid\d{2})-[A-Za-z0-9_\-]{50,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "Chave da OpenAI / compatível"
regex = '''sk-(?:proj-)?[A-Za-z0-9]{32,}'''
keywords = ["sk-"]

[[rules]]
id = "openrouter-api-key"
description = "Chave do OpenRouter"
regex = '''sk-or-v1-[A-Za-z0-9]{32,}'''
keywords = ["sk-or-"]

[[rules]]
id = "github-pat"
description = "Token do GitHub (o adapter de OSINT usa um)"
regex = '''gh[pousr]_[A-Za-z0-9]{36,}'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]

[[rules]]
id = "shodan-api-key"
description = "Chave do Shodan (adapter de exposição)"
regex = '''(?i)shodan[_\-. ]?api[_\-. ]?key['"\s:=]{1,10}[A-Za-z0-9]{32}'''
keywords = ["shodan"]

# ------------------------------------------------------------------- allowlist
#
# NOMEADA e justificada, item a item. Regra da casa: nada entra aqui sem o motivo
# escrito. Se um dia um segredo de verdade for silenciado por uma destas linhas, o
# motivo escrito é o que denuncia.

[allowlist]
description = "Fixtures de teste: valores publicos ou inventados que EXISTEM para provar que a redacao funciona."
paths = [
  # O teste do scrubber precisa de um JWT para verificar que ele vira <JWT>. O valor
  # e o token de exemplo publico do jwt.io (payload {"sub":"1234567890"}), que nao
  # autentica em lugar nenhum. Sem ele, o teste do controle de PII nao existiria.
  '''tests/unit/test_scrubber\.py''',
  # Os testes do boot guard (SEC-01) precisam de um token "forte" para provar que o
  # guard ACEITA um bom e recusa os de exemplo. Sao hex aleatorios inventados.
  '''tests/unit/test_hardening_block\.py''',
  '''tests/unit/test_boot_guard\.py''',
  # Cenario de integracao: gera o token com secrets.token_hex(24) em tempo de teste.
  '''tests/integration/test_scenarios\.py''',
  # O arquivo de exemplo e, por definicao, so nomes de variaveis sem valor.
  '''\.env\.example''',
  # Este proprio arquivo cita prefixos de chave nas regras e nos comentarios.
  '''\.gitleaks\.toml''',
]
