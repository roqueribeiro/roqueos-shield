# Aceites com prazo do Trivy na imagem do RoqueShield (scripts/release-docker.sh).
#
# Só binários oficiais de scanner de TERCEIROS, e só no caminho de cada um. Em 23/10/2026
# as últimas releases (nuclei 3.11.1, gitleaks 8.30.1, trivy 0.76.0) saem compiladas com
# Go e dependências que já têm CVE corrigido em versão posterior; não há release delas que
# zere isso, e recompilar scanner de terceiro a partir do fonte é outro projeto. O risco é
# de DoS/parsing num processo não-root e sem capability. Ao subir a versão de um destes
# binários, apagar as entradas dele e rodar o release de novo: o que sobrar é real.
# O app (Python, uv.lock) e o pip não têm aceite aqui.
vulnerabilities:
